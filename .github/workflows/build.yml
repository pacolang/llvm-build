name: Build LLVM

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (empty builds without publishing)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            os: ubuntu-22.04
          - host: linux-aarch64
            os: ubuntu-22.04-arm
          - host: macos-aarch64
            os: macos-14
          - host: macos-x86_64
            os: macos-15-intel
          - host: windows-x86_64
            os: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja, clang and lld (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang lld

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: ${{ matrix.host }}
          max-size: 2G

      - name: Build
        id: build
        run: |
          start=$(date +%s)
          if ! ./build.sh ${{ matrix.host }} > build.log 2>&1; then
            tail -n 200 build.log
            exit 1
          fi
          archive="$PWD/llvm-18.1.8-${{ matrix.host }}.tar.xz"
          echo "build took $(( $(date +%s) - start ))s; $(du -h "$archive" | cut -f1) $archive" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload the build log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.host }}
          path: build.log

      - name: Smoke test the archive
        run: |
          rm -rf smoke-prefix && mkdir smoke-prefix
          tar xJf "${{ steps.build.outputs.archive }}" -C smoke-prefix
          prefix="$PWD/smoke-prefix/llvm-18.1.8-${{ matrix.host }}"
          if command -v cygpath > /dev/null; then prefix="$(cygpath -m "$prefix")"; fi
          "$prefix/bin/llvm-config" --version --libs --system-libs --link-static
          if [ -n "${VCToolsInstallDir:-}" ]; then
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER="${VCToolsInstallDir}bin\Hostx64\x64\link.exe"
          fi
          LLVM_SYS_181_PREFIX="$prefix" cargo run --release --manifest-path smoke/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: llvm-${{ matrix.host }}
          path: ${{ steps.build.outputs.archive }}
          compression-level: 0

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: for f in *.tar.xz; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.xz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" dist/* --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "${{ inputs.tag }}" \
            --notes "LLVM 18.1.8 (llvmorg-18.1.8) built by \`build.sh\` at ${{ github.sha }}: static libraries, llvm-config, lld; X86 and AArch64 targets; no assertions. Verify with \`sha256sum -c <archive>.sha256\` or \`gh attestation verify <archive> --repo ${{ github.repository }}\`."
